[package]
name = "sa-coop"
version = "0.3.2"
edition = "2021"
build = "build.rs"

[[bin]]
name = "VC-SA-Coop"
path = "src/main.rs"

[dependencies]
relay = { path = "../relay" }
proto = { path = "../proto" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
