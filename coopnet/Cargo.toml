[package]
name = "coopnet"
version = "0.1.0"
edition = "2021"

[lib]
name = "coopnet64"
crate-type = ["cdylib"]

[dependencies]
proto = { path = "../proto" }
relay = { path = "../relay" }
clipboard-win = "5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
