; Co-op graphics: Gražu. Delete this file (or pick "Išjungta" in sa-coop.exe) to get the game's own look back.
[SystemSettings]
; sharper image (the game's TAA is soft)
r.Tonemapper.Sharpen=0.8
r.Tonemapper.Quality=5
; see further: buildings, props and foliage keep detail longer
r.ViewDistanceScale=3.0
r.StaticMeshLODDistanceScale=0.5
foliage.LODDistanceScale=3.0
r.SkeletalMeshLODBias=-1
; crisper textures at an angle
r.MaxAnisotropy=16
; better shadows, further
r.Shadow.MaxResolution=4096
r.Shadow.MaxCSMResolution=4096
r.Shadow.CSM.MaxCascades=4
r.Shadow.DistanceScale=2.0
r.Shadow.RadiusThreshold=0.01
; reflections on water, wet roads and car paint
r.SSR.Quality=3
r.SSR.MaxRoughness=0.8
; contact shadows in corners and under cars
r.AmbientOcclusionLevels=3
r.AmbientOcclusionRadiusScale=1.2
; softer, nicer glow on neon
r.BloomQuality=5
r.LightShaftQuality=1
; no smearing when turning
r.DefaultFeature.MotionBlur=0
r.MotionBlurQuality=0
; less grain
r.SceneColorFringeQuality=0
r.Tonemapper.GrainQuantization=0
