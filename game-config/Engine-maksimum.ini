; Co-op graphics: Maksimum (needs a strong GPU). Delete this file (or pick "Išjungta" in sa-coop.exe) to undo.
[SystemSettings]
; render above screen resolution, then scale down: the cleanest edges, the biggest cost
r.ScreenPercentage=140
r.Tonemapper.Sharpen=0.6
r.Tonemapper.Quality=5
; see as far as the game allows
r.ViewDistanceScale=5.0
r.StaticMeshLODDistanceScale=0.3
foliage.LODDistanceScale=5.0
foliage.DensityScale=1.0
r.SkeletalMeshLODBias=-2
r.MaxAnisotropy=16
; shadows
r.Shadow.MaxResolution=8192
r.Shadow.MaxCSMResolution=8192
r.Shadow.CSM.MaxCascades=4
r.Shadow.DistanceScale=3.0
r.Shadow.RadiusThreshold=0.005
r.Shadow.FilterMethod=1
; reflections
r.SSR.Quality=4
r.SSR.MaxRoughness=1.0
; ambient occlusion
r.AmbientOcclusionLevels=4
r.AmbientOcclusionRadiusScale=1.4
r.AmbientOcclusionMaxQuality=100
; glow
r.BloomQuality=5
r.LightShaftQuality=1
; no smearing, no grain
r.DefaultFeature.MotionBlur=0
r.MotionBlurQuality=0
r.SceneColorFringeQuality=0
r.Tonemapper.GrainQuantization=0
