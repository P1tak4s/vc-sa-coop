[package]
name = "vc-sa-coop-setup"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "VC-SA-Coop-Setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"
